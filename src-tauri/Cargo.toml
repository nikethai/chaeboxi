[package]
description = "Tauri runtime for Chaeboxi"
edition = "2021"
name = "chaeboxi"
version = "1.2.0"

[build-dependencies]
tauri-build = {version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
futures-util = "0.3"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", version = "0.0.0" }
hostname = "0.4"
http = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = {version = "0.16.0", features = [
  "client",
  "reqwest",
  "transport-streamable-http-client-reqwest",
  "transport-child-process",
] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tauri = {version = "2", features = [] }
tokio = {version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = {version = "1", features = ["v4", "serde"] }
webbrowser = "1"
