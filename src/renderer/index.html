<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="height=device-height, width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chaeboxi" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Chaeboxi — multi-platform AI copilot" />
    <link rel="apple-touch-icon" href="./static/logo192.png" />
    <link rel="icon" href="./static/icon.png" type="image/png" />
    <title>Chaeboxi</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Upstream telemetry removed -->
    <script>
      var initialTheme = localStorage.getItem('initial-theme')
      if (initialTheme === 'light' || initialTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', initialTheme)
        document.documentElement.setAttribute('data-mantine-color-scheme', initialTheme)
      }
    </script>
    <style>
      html[data-theme='dark'] {
        background-color: #121214;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 1;
        background-color: #ffffff;
        overflow: hidden;
      }
      html[data-theme='dark'] .splash-screen {
        background-color: #121214;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
      }

      .splash-screen-logo {
        display: block;
        width: 88px;
        height: 88px;
        border-radius: 22%;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      }
      html[data-theme='dark'] .splash-screen-logo {
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      .splash-screen-logo-bg {
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e4e4e8;
        pointer-events: none;
      }
      html[data-theme='dark'] .splash-screen-logo-bg {
        color: #2a2a32;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div class="splash-screen">
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <img
          class="splash-screen-logo"
          src="./static/icon.png"
          width="88"
          height="88"
          alt="Chaeboxi"
        />

        <svg
          class="splash-screen-logo-bg"
          width="660"
          height="660"
          viewBox="0 0 660 660"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <circle opacity="0.6" cx="331" cy="330" r="229.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.5" cx="330" cy="330" r="254.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.8" cx="330" cy="330" r="179.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.9" cx="331" cy="330" r="154.75" stroke="currentColor" stroke-width="0.5" />
          <circle cx="330" cy="330" r="129.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.7" cx="331" cy="330" r="204.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.4" cx="331" cy="330" r="279.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.3" cx="330" cy="330" r="304.75" stroke="currentColor" stroke-width="0.5" />
          <circle opacity="0.2" cx="330" cy="330" r="329.75" stroke="currentColor" stroke-width="0.5" />
        </svg>
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
