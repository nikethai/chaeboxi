[package]
description = "Tauri runtime for Chaeboxi"
edition = "2021"
name = "chaeboxi"
rust-version = "1.88"
version = "1.7.0"

[lib]
name = "chaeboxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
futures-util = "0.3"
http = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rmcp = {version = "0.16.0", features = [
  "client",
  "reqwest",
  "transport-streamable-http-client-reqwest",
] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
# MSRV: rustc 1.88 — notify-rust 4.18+ requires 1.89; pin for tauri-plugin-notification
notify-rust = "=4.11.7"
tauri-plugin-opener = "2"
tokio = {version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = {version = "1", features = ["v4", "serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", version = "0.0.0" }
hostname = "0.4"
rmcp = {version = "0.16.0", features = ["transport-child-process"] }
webbrowser = "1"

# Desktop shell: tray, global shortcuts, screenshots, clipboard images
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-global-shortcut = "2"
# OS keychain / Credential Manager / secret-service for Integrations secrets
keyring = "3"
# Local semantic RAG: bundled SQLite. Embeddings stored as BLOB; cosine in Rust.
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.7"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
rfd = "0.15"
# Desktop-only ONNX runtime. Never listed under [dependencies] so Android/iOS stay keyword-only.
fastembed = "4"


[features]
default = []
# No-op alias. Desktop target_os cfg links ONNX; do not default-enable (that would hit mobile).
local-embed = []
